<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sidan hittades inte — Leila Salong</title>
  <meta name="description" content="Sidan du letade efter finns inte. Gå tillbaka till Leila Salongens hemsida.">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <style>
    :root {
      --cream: #F2EBD9;
      --linen: #E8DCC8;
      --stone: #D4CCBF;
      --cocoa: #5C4A42;
      --cocoa-dark: #3A2E2A;
      --bark: #3A2E2A;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      background: var(--cream);
      color: var(--bark);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: rgba(242,235,217,0.95);
      border-bottom: 1px solid var(--stone);
      padding: 0 5%;
    }
    .nav-inner {
      display: flex;
      align-items: center;
      height: 68px;
      max-width: 1160px;
      margin: 0 auto;
    }
    .site-logo {
      max-height: 44px;
      width: auto;
      object-fit: contain;
    }
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 5rem 5%;
    }
    .error-mark {
      font-family: Georgia, "Iowan Old Style", serif;
      font-size: clamp(5rem, 20vw, 10rem);
      font-weight: 700;
      color: var(--cocoa);
      line-height: 1;
      letter-spacing: -0.04em;
      margin-bottom: 1.5rem;
      opacity: 0.18;
    }
    h1 {
      font-family: Georgia, "Iowan Old Style", serif;
      font-size: clamp(1.75rem, 4vw, 2.75rem);
      color: var(--bark);
      letter-spacing: -0.01em;
      margin-bottom: 1rem;
    }
    p {
      font-size: 1.05rem;
      color: var(--cocoa);
      max-width: 48ch;
      line-height: 1.7;
      margin-bottom: 2.5rem;
    }
    a.btn {
      display: inline-block;
      background: var(--cocoa);
      color: var(--cream);
      font-weight: 600;
      font-size: 0.95rem;
      padding: 0.85rem 2rem;
      border-radius: 100px;
      text-decoration: none;
      transition: background 250ms cubic-bezier(0.16,1,0.3,1), box-shadow 250ms cubic-bezier(0.16,1,0.3,1), transform 250ms cubic-bezier(0.16,1,0.3,1);
    }
    a.btn:hover {
      background: var(--cocoa-dark);
      box-shadow: 0 6px 24px rgba(92,74,66,0.35);
      transform: translateY(-2px);
    }
    footer {
      text-align: center;
      padding: 2rem 5%;
      font-size: 0.82rem;
      color: var(--stone);
      border-top: 1px solid var(--stone);
    }
    @media (prefers-reduced-motion: reduce) {
      a.btn { transition: none; }
    }
  </style>
</head>
<body>
  <header>
    <div class="nav-inner">
      <a href="index.html">
        <img src="logo.png" alt="Leila Salong" class="site-logo">
      </a>
    </div>
  </header>

  <main>
    <div class="error-mark" aria-hidden="true">404</div>
    <h1>Hoppsan — den sidan finns inte</h1>
    <p>Det verkar som att länken du följde är trasig eller att sidan har flyttats. Ingen fara — vi hjälper dig tillbaka.</p>
    <a href="index.html" class="btn">Tillbaka till startsidan</a>
  </main>

  <footer>
    <p>&copy; 2024 Leila Salong &mdash; Östra Mårtensgatan 14A, Lund</p>
  </footer>
</body>
</html>
